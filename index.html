<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Shalanie 🎂</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="card" id="card">

        <!-- Closed state: tap the cake to pop -->
        <div class="closed" id="closedState">
            <div class="cake-emoji" id="cake">🎂</div>
            <p class="hint">tap the cake</p>
        </div>

        <!-- Opened state: the message -->
        <div class="open hidden" id="openState">
            <p class="small">for</p>
            <h1>Shalanie</h1>
            <div class="line"></div>
            <p class="message">
                Happy Birthday To you! Wishing you
                 a great day as soft and beautiful as you are Im proud of you! sa lahat ng achivements mo, galingan mo pa palagi Enjoy 
        your Day! 🌷
            </p>
            <p class="sign">— with love</p>
        </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
